<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8F4A30"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="330" rx="22" fill="#F6EEE2"/>
  <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#4A3426">How Mimo works</text>

  <!-- 1. You -->
  <rect x="30" y="84" width="190" height="150" rx="18" fill="#F2B8A2"/>
  <text x="125" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#5A2A1A">You</text>
  <text x="125" y="166" text-anchor="middle" font-size="15" fill="#5A2A1A">speak, snap a</text>
  <text x="125" y="188" text-anchor="middle" font-size="15" fill="#5A2A1A">receipt or type</text>

  <!-- 2. Mimo app -->
  <rect x="270" y="84" width="190" height="150" rx="18" fill="#C7D9A7"/>
  <text x="365" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#2F3D1C">Mimo app</text>
  <text x="365" y="166" text-anchor="middle" font-size="15" fill="#2F3D1C">React Native</text>
  <text x="365" y="188" text-anchor="middle" font-size="15" fill="#2F3D1C">works offline</text>

  <!-- 3. Supabase -->
  <rect x="510" y="84" width="190" height="150" rx="18" fill="#AFCDE6"/>
  <text x="605" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#1D3550">Supabase</text>
  <text x="605" y="166" text-anchor="middle" font-size="15" fill="#1D3550">login, database</text>
  <text x="605" y="188" text-anchor="middle" font-size="15" fill="#1D3550">and Edge Function</text>

  <!-- 4. Gemini -->
  <rect x="750" y="84" width="180" height="150" rx="18" fill="#F0CF7E"/>
  <text x="840" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#4E3A0B">Gemini AI</text>
  <text x="840" y="166" text-anchor="middle" font-size="15" fill="#4E3A0B">reads receipts</text>
  <text x="840" y="188" text-anchor="middle" font-size="15" fill="#4E3A0B">and speech</text>

  <!-- arrows -->
  <line x1="222" y1="159" x2="266" y2="159" stroke="#8F4A30" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="462" y1="159" x2="506" y2="159" stroke="#8F4A30" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="702" y1="159" x2="746" y2="159" stroke="#8F4A30" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="480" y="284" text-anchor="middle" font-size="16" fill="#6B5446">The expense comes back sorted into your budget. You check it, then save it.</text>
</svg>
